<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Espelho de Ponto</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: cabeçalho fixo com abas, área central em papel branco sobre fundo azul-acinzentado; horários em mono como cupom de relógio de ponto. */
:root{
  --bg:#EDF2F8; --surface:#FFFFFF; --ink:#14233A; --muted:#566A82; --line:#D2DCE8; --soft:#F4F7FB;
  --accent:#1F6BC2; --accent-ink:#FFFFFF; --accent-soft:#E0EEFC;
  --ok:#1F7A4D; --ok-bg:#DDF3E7; --warn:#7A5A00; --warn-bg:#FFF2BF; --bad:#C4121A; --bad-bg:#FDE3E3; --off:#E3E9F0;
  --brand-blue:#2F7FD6; --brand-yellow:#F8C800; --brand-red:#E81820;
  --bar-bg:#FFFFFF; --bar-ink:#14233A; --bar-muted:#566A82;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1621; --surface:#142130; --ink:#E8EEF6; --muted:#97A9BE; --line:#26364A; --soft:#192A3C;
  --accent:#6AAEF0; --accent-ink:#08203B; --accent-soft:#12283F;
  --ok:#6FD3A0; --ok-bg:#15301F; --warn:#F8D24A; --warn-bg:#3A3010; --bad:#FF8F8F; --bad-bg:#3C1A1C; --off:#1D2C3D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1621; --surface:#142130; --ink:#E8EEF6; --muted:#97A9BE; --line:#26364A; --soft:#192A3C;
  --accent:#6AAEF0; --accent-ink:#08203B; --accent-soft:#12283F;
  --ok:#6FD3A0; --ok-bg:#15301F; --warn:#F8D24A; --warn-bg:#3A3010; --bad:#FF8F8F; --bad-bg:#3C1A1C; --off:#1D2C3D; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1080px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;background:var(--bar-bg);color:var(--bar-ink);border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;padding:14px 20px;margin-top:20px}
.stripe{height:5px;display:flex;border-radius:0 0 10px 10px;overflow:hidden;margin-bottom:16px}
.stripe i{flex:1}.stripe i:nth-child(1){background:var(--brand-blue);flex:3}.stripe i:nth-child(2){background:var(--brand-yellow)}.stripe i:nth-child(3){background:var(--brand-red)}
.brand{display:flex;align-items:center;gap:16px;min-width:0;flex-wrap:wrap}
.brand img{height:44px;width:auto;max-width:100%;display:block}
.brand .vl{width:1px;align-self:stretch;background:#D2DCE8}
.brand .sub{color:var(--bar-muted)}
h1{font-size:19px;color:var(--bar-ink);font-weight:600;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font:inherit;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
button,.btn{font:inherit}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
input[type=date],input[type=time],input[type=text],select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12px;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--accent)}
.sp{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.pad{padding:16px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--soft)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.c{text-align:center}
.muted{color:var(--muted)}
tbody tr.link{cursor:pointer}
tbody tr.link:hover td{background:var(--soft)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}
.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)}

.p-info{background:var(--accent-soft);color:var(--accent)}
tr.r-sem_registro td{background:var(--bad-bg)}
tr.r-dsr td,tr.r-fora td{background:var(--off);color:var(--muted)}
td.miss{background:var(--warn-bg)}
.neg{color:var(--bad)} .pos{color:var(--ok)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:36px 20px;text-align:center;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop h2{margin:0 0 6px;font-size:18px;font-weight:600}
.drop p{margin:0 0 16px;color:var(--muted);max-width:52ch;margin-inline:auto}
.banner{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:14px 16px;margin-bottom:16px}
.banner.err{border-color:var(--bad);background:var(--bad-bg)}
.banner h3{margin:0 0 4px;font-size:15px}
.banner .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stats{display:flex;gap:6px 18px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.stats b{color:var(--ink);font-weight:600}
.paper{padding:28px 28px 22px}
.paper h2{margin:0;text-align:center;font-size:17px;font-weight:600;letter-spacing:.14em}
.paper .emp{text-align:center;color:var(--muted);margin-bottom:18px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 24px;margin-bottom:16px}
.meta div{display:flex;gap:8px;min-width:0}
.meta span:first-child{color:var(--muted);min-width:96px}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:44px}
.sign div{border-top:1px solid var(--ink);padding-top:6px;text-align:center;font-size:12px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin-top:10px}
.list{display:flex;flex-direction:column}
.list .it{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;z-index:50;max-width:calc(100vw - 32px)}
#modal .scrim{position:fixed;inset:0;background:rgba(10,18,24,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
#modal .dlg{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;width:100%;max-width:440px;max-height:calc(100% - 16px);overflow:auto}
.dlg h3{margin:0 0 2px;font-size:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.dlg .field input[type=text]{width:100%}
.chk{display:flex;gap:8px;align-items:center;margin:12px 0}
.days{display:flex;gap:8px;flex-wrap:wrap}
.days label{display:flex;gap:6px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
@media (max-width:560px){.paper{padding:18px 14px}.sign{gap:16px}th,td{padding:8px}}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .12s}}

[hidden]{display:none!important}
html{color-scheme:light}
body{margin:0}
img{max-width:100%}
.login{min-height:100vh;display:flex;flex-direction:column;margin-inline:-16px}
.lbar{background:var(--bar-bg);padding:14px 24px;display:flex;align-items:center}
.lbar img{height:48px;width:auto;max-width:100%;display:block}
.lstripe{margin:0;border-radius:0;height:5px}
.lmain{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.login .box{width:100%;max-width:400px;background:var(--bar-bg);color:var(--bar-ink);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.login .in{padding:28px 28px 24px}
.login h1{text-align:center;font-size:20px;margin:0 0 4px}
.login .sub{text-align:center;color:var(--bar-muted);margin-bottom:20px}
.login .field{margin-bottom:14px}
.login .field label{color:#566A82}
.login input[type=text],.login input[type=password]{width:100%;font:inherit;color:#14233A;background:#fff;border:1px solid #B9C7D8;border-radius:6px;padding:10px 11px}
.login .btn.primary{width:100%;justify-content:center;padding:11px 14px;margin-top:4px}
.login .chk{margin:0 0 6px;font-size:13px;color:#566A82}
.login .err{background:#FDE3E3;color:#9B1118;border-radius:6px;padding:9px 11px;margin-bottom:14px;font-size:13px}
.login{position:fixed;inset:0;margin:0;min-height:0;overflow:auto;isolation:isolate}
#lfx{position:fixed;inset:0;z-index:0;pointer-events:none;display:block}
.login>.lbar,.login>.lstripe,.login>.lmain,.login>.lfoot{position:relative;z-index:1}
.login .box{background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);box-shadow:0 18px 50px -20px rgba(31,107,194,.35),0 2px 8px rgba(20,35,58,.06);border-color:rgba(255,255,255,.7)}
.lfoot{text-align:center;color:var(--muted);font-size:13px;padding:0 16px 22px}
.lfoot b{color:var(--ink);font-weight:600}
</style>
</head><body><div id="login" class="login" hidden>
<div class="lbar"><img id="llogo" alt="Educação em Foco — Equipamentos Educacionais" width="154" height="44"></div>
<div class="stripe lstripe" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="lmain"><div class="box"><div class="in"><h1>Espelho de Ponto</h1><div class="sub">Acesso restrito. Entre com seu usuário e senha.</div>
<div class="err" id="lerr" role="alert" hidden></div>
<form id="lform" autocomplete="on"><div class="field"><label for="lusr">Usuário</label><input type="text" id="lusr" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
<div class="field"><label for="lpwd">Senha</label><input type="password" id="lpwd" name="password" autocomplete="current-password" required></div>
<label class="chk"><input type="checkbox" id="lshow"> Mostrar senha</label>
<button class="btn primary" id="lbtn" type="submit">Entrar</button></form></div></div></div>
<footer class="lfoot">Powered by <b>Vitor Senra</b></footer>
</div>
<div id="app" hidden><div class="wrap">
<header class="top"><div class="brand"><img id="logo" alt="Educação em Foco — Equipamentos Educacionais" width="154" height="44"><span class="vl"></span><div><h1>Espelho de Ponto</h1><div class="sub">Importe o arquivo do relógio e consulte por funcionário e período</div></div></div>
<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label class="btn primary" id="hdrimp" for="file">Importar do relógio</label><span id="whoami" class="sub" style="margin:0"></span><button class="btn" id="chpwd" data-a="chpwd" type="button" hidden style="color:#14233A;border-color:#D2DCE8;background:#fff">Alterar senha</button><button class="btn" id="logout" type="button" style="color:#14233A;border-color:#D2DCE8;background:#fff">Sair</button><span class="pill p-info" id="ro" hidden>Somente consulta</span></div><input type="file" id="file" accept=".txt,.xls,.xlsx,.TXT,.XLS,.XLSX"></header>
<div class="stripe" aria-hidden="true"><i></i><i></i><i></i></div>
<nav class="tabs" id="tabs" role="tablist"></nav>
<main id="view"></main>
</div></div>
<div id="modal"></div><div id="toast" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script><script>// ==CORE-START==
const pad=n=>String(n).padStart(2,'0');
const isoOf=(y,m,d)=>y+'-'+pad(m)+'-'+pad(d);
function parseISO(s){const a=s.split('-').map(Number);return new Date(Date.UTC(a[0],a[1]-1,a[2]));}
function addDays(iso,k){const d=parseISO(iso);d.setUTCDate(d.getUTCDate()+k);return d.toISOString().slice(0,10);}
function wdOf(iso){return parseISO(iso).getUTCDay();}
function normTime(v){if(v==null)return '';const m=String(v).match(/(\d{1,2}):(\d{2})/);return m?pad(+m[1])+':'+m[2]:'';}
function toMin(t){if(!t)return null;const a=t.split(':').map(Number);return a[0]*60+a[1];}
// Distribui batidas soltas nos 4 campos (entrada, saída almoço, volta almoço, saída)
function classify(ps){
  const out=['','','',''];
  if(ps.length>=4) return ps.slice(0,4);
  ps.forEach((t,i)=>{
    const m=toMin(t);
    if(i===0&&m<11*60) out[0]=t;
    else if(m<12*60+45&&!out[1]) out[1]=t;
    else if(m<15*60+30&&!out[2]) out[2]=t;
    else if(m>=11*60&&!out[3]) out[3]=t;
    else if(!out[0]) out[0]=t;
  });
  return out;
}
function parseRelogio(wb){
  const find=nm=>{const k=wb.SheetNames.find(n=>n.trim().toLowerCase()===nm);return k?XLSX.utils.sheet_to_json(wb.Sheets[k],{header:1,defval:null,raw:true}):null;};
  const res=find('resumo'), an=find('anormal')||[], reg=find('registros');
  if(!res||!reg) throw new Error('Não encontrei as abas Resumo e Registros. Esse arquivo parece não ser o relatório de frequência do relógio.');
  let txt='';
  for(const r of res.slice(0,4)){for(const c of r){if(typeof c==='string'&&/\d{4}\/\d{2}\/\d{2}/.test(c)){txt=c;break;}} if(txt)break;}
  const m=txt.match(/(\d{4})\/(\d{2})\/(\d{2})\s*~\s*(?:(\d{4})\/)?(\d{2})\/(\d{2})/);
  if(!m) throw new Error('Não consegui ler o período do relatório.');
  const ini=isoOf(+m[1],+m[2],+m[3]);
  const fy=m[4]?+m[4]:(+m[5]<+m[2]?+m[1]+1:+m[1]);
  const fim=isoOf(fy,+m[5],+m[6]);
  const funcionarios=[];
  for(const r of res){const n=Number(r[0]);if(r[0]!=null&&Number.isInteger(n)&&n>0&&typeof r[1]==='string'&&r[1].trim()) funcionarios.push({n,nome:r[1].trim(),dep:String(r[2]||'').trim()});}
  let impresso=fim;
  for(const r of reg.slice(0,6)){r.forEach((c,i)=>{if(typeof c==='string'&&/Impresso/i.test(c)){for(let j=i+1;j<r.length;j++){const mm=String(r[j]||'').match(/(\d{4})\/(\d{2})\/(\d{2})/);if(mm){impresso=isoOf(+mm[1],+mm[2],+mm[3]);break;}}}});}
  const ip=ini.split('-').map(Number);
  const dayIso=d=>{let y=ip[0],mo=ip[1];if(d<ip[2]){mo++;if(mo>12){mo=1;y++;}}return isoOf(y,mo,d);};
  const map={};
  let colDay={},cur=null;
  for(const r of reg){
    if(typeof r[0]==='number'&&r[0]>=1&&r[0]<=31){colDay={};r.forEach((v,c)=>{if(typeof v==='number'&&v>=1&&v<=31)colDay[c]=Math.round(v);});continue;}
    if(r[0]==='Nº'){const nn=r.find(v=>typeof v==='number');cur=nn!=null?Math.round(nn):null;continue;}
    if(cur==null)continue;
    r.forEach((v,c)=>{
      if(colDay[c]==null||typeof v!=='string'||v.indexOf(':')<0)return;
      const ps=(v.match(/\d{1,2}:\d{2}/g)||[]).map(normTime);
      const iso=dayIso(colDay[c]);
      if(iso<ini||iso>fim)return;
      map[cur+'|'+iso]={n:cur,data:iso,p:classify(ps),atraso:0,saidaAnt:0};
    });
  }
  for(const r of an){
    const n=Number(r[0]);
    if(r[0]==null||!Number.isInteger(n)||typeof r[3]!=='string'||!/^\d{4}\/\d{2}\/\d{2}$/.test(r[3]))continue;
    const iso=r[3].replace(/\//g,'-');
    map[n+'|'+iso]={n,data:iso,p:[normTime(r[4]),normTime(r[5]),normTime(r[6]),normTime(r[7])],atraso:Number(r[8])||0,saidaAnt:Number(r[9])||0};
  }
  const dias=Object.values(map).sort((a,b)=>a.n-b.n||(a.data<b.data?-1:1));
  return {ini,fim,impresso,funcionarios,dias};
}

// Cadastro base (número, nome, departamento). Só preenche o que faltar; editável na aba Funcionários.
const CADASTRO_BASE=[{n:1,nome:'Diogo',dep:'Adm'},{n:2,nome:'Roberto',dep:'Adm'},{n:3,nome:'Vitor',dep:'Adm'},{n:4,nome:'Ingrid',dep:'Adm'},{n:5,nome:'Emilly',dep:'Comercial'},{n:6,nome:'Carol',dep:'Comercial'},{n:7,nome:'Paula',dep:'Comercial'},{n:8,nome:'Vitoria',dep:'Comercial'},{n:9,nome:'Leticia',dep:'Adm'},{n:10,nome:'Gustavo',dep:'Adm'}];
// Arquivo de batidas do relógio (UDISKLOG, ex.: GLG_001.txt): uma linha por batida, sem separar entrada/saída.
function parseGLG(text){
  const lines=String(text).replace(/^﻿/,'').split(/\r?\n/);
  if(!lines.length||!/UDISKLOG/i.test(lines[0]))throw new Error('Esse arquivo não parece ser o GLG do relógio de ponto (não encontrei o cabeçalho UDISKLOG).');
  const hd=lines[0].match(/date=(\d{4})-(\d{2})-(\d{2})/);
  const exportDate=hd?isoOf(+hd[1],+hd[2],+hd[3]):null;
  const re=/^\s*\d+\s+\d+\s+(\d+)\s+(.+?)\s+\d+\s+\d+\s+(\d{4})\/(\d{2})\/(\d{2})\s+(\d{1,2}):(\d{2}):(\d{2})/;
  const names={},byDay={};
  for(const ln of lines.slice(1)){
    const m=ln.match(re);if(!m)continue;
    const n=parseInt(m[1],10);if(!n)continue;
    const iso=isoOf(+m[3],+m[4],+m[5]);const sec=(+m[6])*3600+(+m[7])*60+(+m[8]);
    names[n]=m[2].trim();
    const k=n+'|'+iso;(byDay[k]=byDay[k]||{n,iso,secs:[]}).secs.push(sec);
  }
  const keys=Object.keys(byDay);
  if(!keys.length)throw new Error('Não encontrei nenhuma batida neste arquivo.');
  const dias=[];
  keys.forEach(k=>{
    const d=byDay[k];const s=Array.from(new Set(d.secs)).sort((a,b)=>a-b);
    const keep=[];s.forEach(x=>{if(!keep.length||x-keep[keep.length-1]>120)keep.push(x);}); // ignora batida dupla em até 2 min
    const ps=keep.map(x=>pad(Math.floor(x/3600))+':'+pad(Math.floor(x%3600/60)));
    dias.push({n:d.n,data:d.iso,p:classify(ps),atraso:0,saidaAnt:0,extra:ps.length>4?ps.length-4:0});
  });
  dias.sort((a,b)=>a.n-b.n||(a.data<b.data?-1:1));
  const dates=Array.from(new Set(dias.map(d=>d.data))).sort();
  // início do período: primeiro dia com batidas de 2 ou mais pessoas (antes disso o relógio estava sendo configurado)
  const cnt={};dias.forEach(d=>{cnt[d.data]=(cnt[d.data]||0)+1;});
  const ini=dates.find(x=>cnt[x]>=2)||dates[0];
  const last=dates[dates.length-1];
  const fim=exportDate&&exportDate>last?exportDate:last;
  const impresso=exportDate||last;
  const base={};CADASTRO_BASE.forEach(f=>base[f.n]=f);
  const func={};
  Object.keys(names).forEach(n=>{func[n]={n:+n,nome:names[n],dep:base[n]?base[n].dep:''};});

  const funcionarios=Object.values(func).sort((a,b)=>a.n-b.n);
  return {ini,fim,impresso,funcionarios,dias:dias.filter(d=>d.data>=ini),formato:'glg'};

function renderToast(){$('#toast').innerHTML=S.msg?'<div class="toast" role="status">'+esc(S.msg)+'</div>':'';}

function getRec(n,iso){const d=S.ponto[n+'_'+iso.slice(0,7).replace('-','')];return d&&d.dias?d.dias[iso.slice(8)]:null;}
function periodoOf(iso){return S.periodos.find(p=>p.ini<=iso&&iso<=p.fim)||null;}
function atrasoCalc(p){const c=cfg(),tol=Number(c.tol)||0;let a=0;const e=toMin(p[0]),v=toMin(p[2]);if(e!=null&&e-toMin(c.ent)>tol)a+=e-toMin(c.ent);if(v!=null&&v-toMin(c.va)>tol)a+=v-toMin(c.va);return a;}
function dayInfo(n,iso){
  const rec=getRec(n,iso), per=periodoOf(iso), wk=workday(iso);
  const p=rec&&rec.p?rec.p.slice():['','','',''];
  let worked=0;
  if(p[0]&&p[1])worked+=toMin(p[1])-toMin(p[0]);
  if(p[2]&&p[3])worked+=toMin(p[3])-toMin(p[2]);
  const miss=[];p.forEach((v,i)=>{if(!v)miss.push(i);});
  const open=per&&iso>=per.impresso;
  let st;
  if(!per&&!rec)st='fora';
  else if(rec&&rec.just)st='just';
  else if(!wk&&!rec)st='dsr';
  else if(!rec)st=open?'andamento':'sem_registro';
  else if(open)st='andamento';
  else if(!wk)st='ok';
  else st=miss.length?'incompleta':'ok';
  const prev=wk&&per&&!open&&!(rec&&rec.just)?prevDia():0;
  return {iso,wd:wdOf(iso),rec,p,worked,miss,st,atraso:rec?atrasoCalc(p):0,prev,obs:rec&&rec.obs||'',manual:!!(rec&&rec.manual)};
}
function listDays(de,ate){const a=[];if(!de||!ate||de>ate)return a;for(let d=de;d<=ate&&a.length<400;d=addDays(d,1))a.push(d);return a;}
function summarize(n){
  const r={prev:0,worked:0,atrN:0,atrMin:0,falta:0,inc:0,dias:0};
  listDays(S.de,S.ate).forEach(iso=>{const d=dayInfo(n,iso);
    r.prev+=d.prev;
    if(d.prev||d.st==='ok'||d.st==='incompleta')r.worked+=d.worked;
    if(d.atraso>0){r.atrN++;r.atrMin+=d.atraso;}
    if(d.st==='sem_registro')r.falta++;
    if(d.st==='incompleta')r.inc++;
    if(d.st!=='fora'&&d.st!=='dsr')r.dias++;});
  return r;
}

async function lerArquivo(file){
  S.busy='Lendo '+file.name+'…';render();
  try{
    let r;
    const isTxt=/\.txt$/i.test(file.name);
    if(isTxt){r=parseGLG(await file.text());}
    else{
      if(!window.XLSX)throw new Error('A biblioteca de leitura não carregou. Recarregue a página.');
      r=parseRelogio(XLSX.read(await file.arrayBuffer(),{type:'array'}));
    }
    let novos=0,atual=0,pres=0;
    r.dias.forEach(d=>{const ex=getRec(d.n,d.data);if(!ex)novos++;else if(ex.manual)pres++;else atual++;});
    S.pending=Object.assign(r,{arquivo:file.name,novos,atual,pres,erro:''});
  }catch(e){S.pending={erro:e.message||String(e),arquivo:file.name};}
  S.busy='';render();
}

    const k=n+'_'+iso.slice(0,7).replace('-','');

    const dias=Object.assign({},ex.dias||{});const prev=dias[iso.slice(8)];
    dias[iso.slice(8)]={p,atraso:atrasoCalc(p),saidaAnt:0,manual:true,obs,just,orig:prev&&prev.manual?prev.orig:(prev?prev.p:['','','',''])};
    try{await db.doc('ponto/'+k).set({n:ex.n,mes:ex.mes,dias});close();toast('Ajuste salvo.');}catch(e){toast('Não foi possível salvar o ajuste.');}
  };
  const rs=$('#edreset');
  if(rs)rs.onclick=async()=>{
    const k=n+'_'+iso.slice(0,7).replace('-','');const ex=S.ponto[k];const dias=Object.assign({},ex.dias);const cur=dias[iso.slice(8)];
    const orig=cur.orig||['','','',''];

  };

}

/* ---------- banco de horas ---------- */
const parseHM=t=>{t=String(t||'').trim();const neg=t[0]==='-';if(t[0]==='-'||t[0]==='+')t=t.slice(1);const m=t.match(/^(\d{1,4}):([0-5]\d)$/);return m?(neg?-1:1)*((+m[1])*60+(+m[2])):null;};
const fmtS=m=>(m>0?'+':'')+fmtHM(m);
const clsS=m=>m<0?'neg':m>0?'pos':'';
function bancoRange(){const P=S.periodos;if(!P.length)return null;return {ini:P.reduce((m,p)=>p.ini<m?p.ini:m,P[0].ini),fim:P.reduce((m,p)=>p.fim>m?p.fim:m,P[0].fim)};}
function bancoCalc(n){
  const f=S.funcs[n],R=bancoRange(),B=S.banco[n]||{};
  const ev=[];let pend=0;
  if(R&&f){
    let ini=R.ini;if(f.ini&&f.ini>ini)ini=f.ini;
    const td=cfg().tolDia==null?10:Number(cfg().tolDia);
    for(let iso=ini,k=0;iso<=R.fim&&k<4000;iso=addDays(iso,1),k++){
      const d=dayInfo(n,iso);
      if(d.st==='fora'||d.st==='dsr'||d.st==='andamento')continue;
      if(d.st==='just'){ev.push({iso,tipo:'just',diff:0,d});continue;}
      if(!d.prev&&!d.worked)continue;
      let diff=d.worked-d.prev;if(Math.abs(diff)<=td)diff=0;
      if(d.st==='incompleta'||d.st==='sem_registro')pend++;
      ev.push({iso,tipo:'dia',diff,d});
    }
  }
  (B.lanc||[]).forEach(l=>ev.push({iso:l.data,tipo:'lanc',diff:l.min,l}));
  ev.sort((a,b)=>a.iso<b.iso?-1:a.iso>b.iso?1:(a.tipo==='lanc'?1:0)-(b.tipo==='lanc'?1:0));
  let run=B.ini||0;ev.forEach(e=>{run+=e.diff;e.run=run;});
  return {ev,ini:B.ini||0,saldo:run,pend,fim:R?R.fim:''};
}
function bancoPeriodo(B,de,ate){
  let ant=B.ini,cred=0,deb=0,lan=0;
  B.ev.forEach(e=>{if(e.iso<de)ant+=e.diff;else if(e.iso<=ate){if(e.tipo==='lanc')lan+=e.diff;else if(e.diff>0)cred+=e.diff;else deb+=e.diff;}});
  return {ant,cred,deb,lan,fim:ant+cred+deb+lan};
}
function bancoLinhas(B,de,ate){
  return B.ev.filter(e=>e.iso>=de&&e.iso<=ate).map(e=>{
    if(e.tipo==='lanc')return {iso:e.iso,dia:'',trab:'',prev:'',diff:e.diff,run:e.run,obs:'Lançamento: '+(e.l.obs||(e.diff<0?'débito':'crédito')),l:e.l};
    const d=e.d;return {iso:e.iso,dia:WDN[d.wd].slice(0,3),trab:d.worked?fmtHM(d.worked):'–',prev:d.prev?fmtHM(d.prev):'–',diff:e.diff,run:e.run,obs:e.tipo==='just'?'Justificado'+(d.obs?' · '+d.obs:''):obsTexto(d)};
  });
}

/* Camada que liga o sistema à API do Cloudflare (substitui o armazenamento da Claude). */
(function(){
  async function req(method,path,body){
    const r=await fetch('/api'+path,{method,credentials:'same-origin',headers:{'content-type':'application/json','x-requested-with':'espelho-ponto'},body:body?JSON.stringify(body):undefined});
    if(r.status===401){window.dispatchEvent(new Event('sessao-expirada'));throw {code:'nao_autenticado',message:'Sessão expirada. Entre novamente.'};}
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw {code:'http_'+r.status,message:j.erro||'Erro no servidor.'};
    return j;
  }
  window.EP_REQ=req;
  const listeners=new Set();
  let nt=null;const notify=()=>{clearTimeout(nt);nt=setTimeout(()=>listeners.forEach(f=>f()),350);};
  setInterval(()=>{if(document.visibilityState==='visible')notify();},60000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')notify();});
  const db={
    collection(name){return {onSnapshot(next){
      let seq=0;const run=async()=>{const my=++seq;try{const j=await req('GET','/col/'+name);if(my!==seq)return;next({docs:j.docs.map(d=>({id:d.id,exists:true,data:()=>d.data}))});}catch(e){}};
      listeners.add(run);run();return()=>listeners.delete(run);}};},
    doc(path){const p=path.split('/'),col=p[0],id=p[1];return {
      async set(data){await req('PUT','/doc/'+col+'/'+id,data);notify();},
      async delete(){await req('DELETE','/doc/'+col+'/'+id);notify();},
      onSnapshot(next){
        let seq=0;const run=async()=>{const my=++seq;try{const j=await req('GET','/doc/'+col+'/'+id);if(my!==seq)return;next({exists:!!j.exists,data:()=>j.data});}catch(e){}};
        listeners.add(run);run();return()=>listeners.delete(run);}};}
  };
  const downloads={async save(o){
    const blob=o.data instanceof Blob?o.data:new Blob([o.data]);
    const url=URL.createObjectURL(blob);const a=document.createElement('a');
    a.href=url;a.download=o.filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);return {status:'saved'};}};
  window.claude={use:async n=>n==='db'?db:n==='downloads'?downloads:n==='user'?{canEdit:()=>(window.EP_ME||{}).papel==='admin'}:null};
})();
